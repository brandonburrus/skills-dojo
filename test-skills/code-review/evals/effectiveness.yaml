evals:
  - name: identifies-sql-injection
    prompt: "Review the code in this project for security vulnerabilities and provide a detailed report."
    criteria:
      - name: "identifies SQL injection vulnerability"
        description: "The agent correctly identifies the SQL injection vulnerability in the code and explains how user input is unsafely interpolated into the query."
        pass_threshold: 0.8
      - name: "provides actionable remediation advice"
        description: "The agent provides specific, implementable fixes such as parameterized queries or prepared statements, not just generic advice."
        pass_threshold: 0.7
      - name: "does not produce false positives"
        description: "The agent does not flag safe code as vulnerable. All reported issues are genuine security concerns present in the code."
        pass_threshold: 0.6
